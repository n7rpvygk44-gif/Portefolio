<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="Terminus">
  <!-- Terminus, planète océan au bord de la Galaxie, siège de la Fondation (illustration originale) -->
  <defs>
    <radialGradient id="te-body" cx="35%" cy="32%" r="72%">
      <stop offset="0" stop-color="#d9f6ff"/>
      <stop offset="0.4" stop-color="#5bb7d6"/>
      <stop offset="0.8" stop-color="#1f6b93"/>
      <stop offset="1" stop-color="#0f3550"/>
    </radialGradient>
    <radialGradient id="te-shade" cx="72%" cy="74%" r="62%">
      <stop offset="0.4" stop-color="#0b1a33" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1a33" stop-opacity="0.65"/>
    </radialGradient>
    <clipPath id="te-clip"><circle cx="150" cy="150" r="110"/></clipPath>
    <filter id="te-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <circle cx="150" cy="150" r="118" fill="#9fe3ff" opacity="0.6" filter="url(#te-glow)"/>
  <circle cx="150" cy="150" r="110" fill="url(#te-body)"/>
  <g clip-path="url(#te-clip)">
    <!-- Îles et continent unique -->
    <path d="M70 120c18-22 52-26 66-10 10 12-4 24 8 36 14 14 40 2 46 22 6 22-24 34-48 28-20-5-24-22-44-22-22 0-40-14-36-30 2-10 4-16 8-24z" fill="#cfe8b4" opacity="0.9"/>
    <path d="M78 126c14-14 40-18 50-6 6 8-4 18 6 28" fill="none" stroke="#8fbf7a" stroke-width="3"/>
    <path d="M196 92c10-6 24-2 26 8 2 8-10 12-18 10-8-2-14-12-8-18z" fill="#e8f2c6"/>
    <path d="M182 214c8-4 18 0 18 6s-10 8-16 6-8-8-2-12z" fill="#e8f2c6"/>
    <!-- Nuages -->
    <g fill="#fff" opacity="0.75">
      <path d="M40 92c30-8 70-6 96 2-26 6-66 8-96-2z"/>
      <path d="M120 196c26-6 60-4 84 4-24 4-58 6-84-4z"/>
      <path d="M150 62c20-4 44-2 60 4-18 4-42 4-60-4z"/>
    </g>
    <circle cx="150" cy="150" r="110" fill="url(#te-shade)"/>
  </g>
  <!-- Le Caveau de Seldon : petit point lumineux sur l'île principale -->
  <circle cx="112" cy="140" r="3.5" fill="#fff8e0"/>
  <circle cx="112" cy="140" r="8" fill="none" stroke="#fff8e0" stroke-width="1" opacity="0.7"/>
  <text x="150" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="7" fill="#1f5f86">TERMINUS</text>
</svg>
